name: Build & Publish Gateway App

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/wayqast.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: android/app/build/outputs/apk/release/wayqast.apk
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gateway app $GITHUB_REF_NAME" \
            --notes "Automated build from $GITHUB_SHA"

      - name: Clean up keystore
        if: always()
        run: rm -f "$SIGNING_KEYSTORE_PATH"
